<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Horária de Aulas do Módulo | IFF</title>
</head>
<body>

    <main>
        
        <section>
            <h2>Horários acadêmicos</h2>
            
            <table>
                <caption>Grade Horária de Aulas Semanais do Módulo</caption>
                <thead>
                    <tr>
                        <th scope="col">Aula</th>
                        <th scope="col">Horário</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Estruturação Multimídia</td>
                        <td>19:00 - 20:30</td>
                    </tr>
                </tbody>
            </table>
            
            <p>Recursos necessários:</p>
            <ul>
                <li>Computador com IDE configurada</li>
                <li>Arquivos de legenda (.vtt) prontos</li>
            </ul>
        </section>

        <hr>

        <section>
            <h2>Apresentação da Disciplina</h2>
            <video controls width="640" height="360">
                <source src="https://dl6.webmfiles.org/big-buck-bunny_trailer.webm" type="video/webm">
                <track src="legendas.vtt" kind="captions" srclang="pt-BR" label="Português (Brasil)" default>
                Seu navegador não suporta a tag de vídeo.
            </video>
        </section>

        <section>
            <h2>Localização do Campus IFF</h2>
            <iframe src="https://iff.edu.br" title="Mapa interativo de localização do Campus IFF" sandbox="allow-scripts allow-same-origin"></iframe>
        </section>

    </main>

</body>
</html>
